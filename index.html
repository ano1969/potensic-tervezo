<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potensic Atom 2 - Tervező</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #111;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1005;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .floating-panel {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            width: calc(100% - 20px);
            max-width: 420px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
        }

        .floating-panel.hidden {
            display: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .panel-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .lang-select {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            background: #f1f5f9;
            cursor: pointer;
            color: #475569;
        }

        .btn-close-panel {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
        }

        .panel-field label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .panel-field input, .panel-field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            background: #f8fafc;
        }

        .angle-control {
            margin-bottom: 10px;
        }

        .angle-header label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
        }

        .angle-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .angle-slider-container input[type="range"] {
            flex-grow: 1;
            height: 6px;
            accent-color: #2563eb;
        }

        .angle-slider-container input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-optimize {
            background: #059669;
        }
