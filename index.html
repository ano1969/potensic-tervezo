<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potensic Atom 2 - Tervező</title>
    <!-- Leaflet & Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1005;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .floating-panel {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            width: calc(100% - 20px);
            max-width: 420px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
            transition: opacity 0.2s ease;
        }

        .floating-panel.hidden {
            display: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .panel-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .lang-select {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            background: #f1f5f9;
            cursor: pointer;
            color: #475569;
        }

        .btn-close-panel {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
        }

        .panel-field label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .panel-field input, .panel-field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            background: #f8fafc;
        }

        .angle-control {
            margin-bottom: 10px;
        }

        .angle-header label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
        }

        .angle-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .angle-slider-container input[type="range"] {
            flex-grow: 1;
            height: 6px;
            accent-color: #2563eb;
        }

        .angle-slider-container input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-optimize {
            background: #059669;
        }

        /* Modal ablak */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.4);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .results-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: #0369a1;
            margin-bottom: 16px;
        }

        .btn-download {
            width: 100%;
            padding: 11px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-drone { background: #0284c7; color: white; }
        .btn-gcp { background: #475569; color: white; }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="toggle-btn" id="togglePanelBtn" onclick="togglePanel()">⚙️ Tervező Panel</button>

    <div class="floating-panel" id="controlPanel">
        <div class="panel-header">
            <div class="panel-title-area">
                <h3 class="panel-title" id="lbl_title">Potensic Tervező</h3>
                <select id="lang_select" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="hu">HU</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <button class="btn-close-panel" onclick="togglePanel()">&times;</button>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="mission_type" id="lbl_mission">Küldetés</label>
                <select id="mission_type" onchange="onMissionTypeChange()">
                    <option value="2D" id="opt_2d">2D Topográfia</option>
                    <option value="3D" id="opt_3d">3D Rácshálós</option>
                    <option value="ORBIT" id="opt_orbit">Épület körbejárás (Orbit)</option>
                </select>
            </div>
            <div class="panel-field">
                <label for="altitude" id="lbl_alt">Magasság (m)</label>
                <input type="number" id="altitude" value="40" step="1" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="gimbal_pitch" id="lbl_pitch">Kamera szög (°)</label>
                <input type="number" id="gimbal_pitch" value="-90" min="-90" max="0" step="5" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field" style="justify-content: flex-end;" id="optimize_container">
                <button class="btn-action btn-optimize" id="btn_optimize" onclick="optimizeAngle()">Optimalizálás</button>
            </div>
        </div>

        <div class="panel-grid" id="orbit_params" style="display: none;">
            <div class="panel-field">
                <label for="orbit_radius" id="lbl_radius">Sugár (m)</label>
                <input type="number" id="orbit_radius" value="25" min="5" max="200" step="1" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field">
                <label for="orbit_points" id="lbl_points">Fotópontok</label>
                <input type="number" id="orbit_points" value="16" min="6" max="36" step="2" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="angle-control" id="rotation_container">
            <div class="angle-header">
                <label for="rotation_angle" id="lbl_rot">Útvonal Elforgatás (°)</label>
            </div>
            <div class="angle-slider-container">
                <input type="range" id="rotation_slider" min="0" max="355" step="5" value="0" oninput="updateRotationFromSlider(this.value)">
                <input type="number" id="rotation_angle" min="0" max="355" step="5" value="0" onchange="updateRotationFromInput(this.value)">
            </div>
        </div>

        <div class="panel-grid" id="offset_container">
            <div class="panel-field">
                <label for="offset_x" id="lbl_offx">Eltolás X (m)</label>
                <input type="number" id="offset_x" value="0" step="1" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field">
                <label for="offset_y" id="lbl_offy">Eltolás Y (m)</label>
                <input type="number" id="offset_y" value="0" step="1" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <button class="btn-action" style="margin-top: 4px;" id="btn_details" onclick="showResultsModal()">Részletek & Letöltés</button>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="lbl_modal_title">Repülési Adatok</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="results-box" id="output_text"></div>
            <button class="btn-download btn-drone" id="btn_dl_drone" onclick="downloadJSON()">Drón JSON (WGS84) Letöltése</button>
            <button class="btn-download btn-gcp" id="btn_dl_gcp" onclick="downloadGCP()">WebODM GCP (EPSG:23700) Letöltése</button>
        </div>
    </div>

    <!-- Leaflet, Draw & Proj4 JS könyvtárak -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <script>
        // Nyelvi szótár
        const dict = {
            hu: {
                toggleBtn: "⚙️ Tervező Panel",
                title: "Potensic Tervező",
                mission: "Küldetés",
                opt2d: "2D Topográfia",
                opt3d: "3D Rácshálós",
                optOrbit: "Épület körbejárás (Orbit)",
                alt: "Magasság (m)",
                pitch: "Kamera szög (°)",
                optimize: "Optimalizálás",
                radius: "Sugár (m)",
                points: "Fotópontok",
                rot: "Útvonal Elforgatás (°)",
                offx: "Eltolás X (m)",
                offy: "Eltolás Y (m)",
                details: "Részletek & Letöltés",
                modalTitle: "Repülési Adatok",
                dlDrone: "Drón JSON (WGS84) Letöltése",
                dlGcp: "WebODM GCP (EPSG:23700) Letöltése",
                alertDraw: "Előbb rajzolj ki egy területet a térképen!",
                mode2d: "2D Topográfia",
                mode3d: "3D Rácshálós",
                modeOrbit: "Épület körbejárás (Orbit)",
                length: "Útvonal hossza",
                time: "Repülési idő",
                photos: "Fotópontok száma",
                expectedPhotos: "Várható képek",
                gsd: "GSD felbontás"
            },
            en: {
                toggleBtn: "⚙️ Planner Panel",
                title: "Potensic Planner",
                mission: "Mission",
                opt2d: "2D Topography",
                opt3d: "3D Cross-Grid",
                optOrbit: "Building Orbit",
                alt: "Altitude (m)",
                pitch: "Gimbal Pitch (°)",
                optimize: "Optimize",
                radius: "Radius (m)",
                points: "Photo Points",
                rot: "Route Rotation (°)",
                offx: "Offset X (m)",
                offy: "Offset Y (m)",
                details: "Details & Download",
                modalTitle: "Flight Data",
                dlDrone: "Download Drone JSON (WGS84)",
                dlGcp: "Download WebODM GCP (EPSG:23700)",
                alertDraw: "Please draw an area on the map first!",
                mode2d: "2D Topography",
                mode3d: "3D Cross-Grid",
                modeOrbit: "Building Orbit",
                length: "Route Length",
                time: "Flight Time",
                photos: "Photo Points",
                expectedPhotos: "Estimated Photos",
                gsd: "GSD Resolution"
            }
        };

        let currentLang = 'hu';

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('togglePanelBtn').innerText = dict[lang].toggleBtn;
            document.getElementById('lbl_title').innerText = dict[lang].title;
            document.getElementById('lbl_mission').innerText = dict[lang].mission;
            document.getElementById('opt_2d').innerText = dict[lang].opt2d;
            document.getElementById('opt_3d').innerText = dict[lang].opt3d;
            document.getElementById('opt_orbit').innerText = dict[lang].optOrbit;
            document.getElementById('lbl_alt').innerText = dict[lang].alt;
            document.getElementById('lbl_pitch').innerText = dict[lang].pitch;
            document.getElementById('btn_optimize').innerText = dict[lang].optimize;
            document.getElementById('lbl_radius').innerText = dict[lang].radius;
            document.getElementById('lbl_points').innerText = dict[lang].points;
            document.getElementById('lbl_rot').innerText = dict[lang].rot;
            document.getElementById('lbl_offx').innerText = dict[lang].offx;
            document.getElementById('lbl_offy').innerText = dict[lang].offy;
            document.getElementById('btn_details').innerText = dict[lang].details;
            document.getElementById('lbl_modal_title').innerText = dict[lang].modalTitle;
            document.getElementById('btn_dl_drone').innerText = dict[lang].dlDrone;
            document.getElementById('btn_dl_gcp').innerText = dict[lang].dlGcp;

            recalculateIfPolygonExists();
        }

        proj4.defs("EPSG:23700", "+proj=somerc +lat_0=47.14439372222222 +lon_0=19.04857177777778 +k_0=0.99993 +x_0=650000 +y_0=200000 +ellps=GRS67 +units=m +no_defs");

        var map = L.map('map', { zoomControl: false }).setView([48.25, 20.62], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        var tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        setTimeout(function() { map.invalidateSize(); }, 200);

        var drawnItems = new L.FeatureGroup();
        var flightPathGroup = new L.FeatureGroup().addTo(map);
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topleft',
            edit: { featureGroup: drawnItems },
            draw: {
                polygon: true,
                rectangle: true,
                polyline: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        let currentPolygonLatLngs = [];
        let calculatedWaypointsWGS84 = [];
        let polygonCenterWGS84 = { lat: 0, lng: 0 };

        L.DomEvent.disableClickPropagation(document.getElementById('controlPanel'));
        L.DomEvent.disableClickPropagation(document.getElementById('togglePanelBtn'));

        function togglePanel() {
            let panel = document.getElementById('controlPanel');
            panel.classList.toggle('hidden');
        }

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.clearLayers();
            flightPathGroup.clearLayers();
            var layer = e.layer;
            drawnItems.addLayer(layer);

            currentPolygonLatLngs = layer.getLatLngs()[0];

            let sumLat = 0, sumLng = 0;
            currentPolygonLatLngs.forEach(p => { sumLat += p.lat; sumLng += p.lng; });
            polygonCenterWGS84 = { lat: sumLat / currentPolygonLatLngs.length, lng: sumLng / currentPolygonLatLngs.length };

            calculateFromPolygon();
        });

        function onMissionTypeChange() {
            let mType = document.getElementById('mission_type').value;
            let pitchInput = document.getElementById('gimbal_pitch');
            let orbitParams = document.getElementById('orbit_params');
            let rotContainer = document.getElementById('rotation_container');
            let offsetContainer = document.getElementById('offset_container');
            let optContainer = document.getElementById('optimize_container');

            if (mType === 'ORBIT') {
                orbitParams.style.display = 'grid';
                rotContainer.style.display = 'none';
                offsetContainer.style.display = 'none';
                optContainer.style.display = 'none';
                if (pitchInput.value === '-90' || pitchInput.value === '-60') {
                    pitchInput.value = '-45';
                }
            } else {
                orbitParams.style.display = 'none';
                rotContainer.style.display = 'block';
                offsetContainer.style.display = 'grid';
                optContainer.style.display = 'flex';
                if (mType === '3D') pitchInput.value = '-60';
                if (mType === '2D') pitchInput.value = '-90';
            }
            recalculateIfPolygonExists();
        }

        function updateRotationFromSlider(val) {
            document.getElementById('rotation_angle').value = val;
            calculateFromPolygon();
        }

        function updateRotationFromInput(val) {
            document.getElementById('rotation_slider').value = val;
            calculateFromPolygon();
        }

        function recalculateIfPolygonExists() {
            if (currentPolygonLatLngs.length >= 3) {
                calculateFromPolygon();
            }
        }

        function rotateWGS84Point(pt, center, angleRad) {
            let cos = Math.cos(angleRad);
            let sin = Math.sin(angleRad);
            let dLng = (pt.lng - center.lng) * 111320 * Math.cos(center.lat * Math.PI / 180);
            let dLat = (pt.lat - center.lat) * 110574;
            let rotDLng = dLng * cos - dLat * sin;
            let rotDLat = dLng * sin + dLat * cos;
            return {
                lat: center.lat + (rotDLat / 110574),
                lng: center.lng + (rotDLng / (111320 * Math.cos(center.lat * Math.PI / 180)))
            };
        }

        function generateOrbitWaypoints(center, radiusM, pointsCount, altitude, pitch) {
            let waypoints = [];
            for (let i = 0; i < pointsCount; i++) {
                let angle = (i / pointsCount) * 2 * Math.PI;
                let dLng = (radiusM * Math.cos(angle)) / (111320 * Math.cos(center.lat * Math.PI / 180));
                let dLat = (radiusM * Math.sin(angle)) / 110574;

                waypoints.push({
                    latitude: Number((center.lat + dLat).toFixed(7)),
                    longitude: Number((center.lng + dLng).toFixed(7)),
                    altitude: altitude,
                    gimbalPitch: pitch,
                    action: "TAKE_PHOTO"
                });
            }
            if (waypoints.length > 0) {
                waypoints.push({...waypoints[0]});
            }
            return waypoints;
        }

        function generatePassWaypoints(polygonLatLngs, center, angleDeg, altitude, pitch, offsetX, offsetY) {
            let angleRad = angleDeg * (Math.PI / 180);
            let rotatedPoly = polygonLatLngs.map(pt => rotateWGS84Point(pt, center, -angleRad));

            let fovRad = 79.4 * (Math.PI / 180);
            let groundWidth = 2 * altitude * Math.tan(fovRad / 2);
            let rowSpacing = groundWidth * (1.0 - 0.70);

            let lats = rotatedPoly.map(p => (p.lat - center.lat) * 110574);
            let lngs = rotatedPoly.map(p => (p.lng - center.lng) * 111320 * Math.cos(center.lat * Math.PI / 180));

            let minX = Math.min(...lats), maxX = Math.max(...lats);
            let minY = Math.min(...lngs), maxY = Math.max(...lngs);

            let heightM = maxX - minX;
            let rows = Math.max(1, Math.floor(heightM / rowSpacing));

            let waypointsRotated = [];
            for (let r = 0; r <= rows; r++) {
                let currX = minX + (r * rowSpacing);
                let yMin = (r % 2 === 0) ? minY : maxY;
                let yMax = (r % 2 === 0) ? maxY : minY;

                waypointsRotated.push({ xM: currX, yM: yMin });
                waypointsRotated.push({ xM: currX, yM: yMax });
            }

            return waypointsRotated.map(pt => {
                let tempPt = {
                    lat: center.lat + ((pt.xM + offsetX) / 110574),
                    lng: center.lng + ((pt.yM + offsetY) / (111320 * Math.cos(center.lat * Math.PI / 180)))
                };
                let worldPt = rotateWGS84Point(tempPt, center, angleRad);
                return {
                    latitude: Number(worldPt.lat.toFixed(7)),
                    longitude: Number(worldPt.lng.toFixed(7)),
                    altitude: altitude,
                    gimbalPitch: pitch,
                    action: "TAKE_PHOTO"
                };
            });
        }

        function calculateFromPolygon() {
            if (currentPolygonLatLngs.length < 3) return;

            let altitude = parseFloat(document.getElementById('altitude').value) || 40;
            let pitch = parseFloat(document.getElementById('gimbal_pitch').value) || -90;
            let missionType = document.getElementById('mission_type').value;
            let t = dict[currentLang];

            calculatedWaypointsWGS84 = [];

            if (missionType === 'ORBIT') {
                let radius = parseFloat(document.getElementById('orbit_radius').value) || 25;
                let points = parseInt(document.getElementById('orbit_points').value) || 16;
                let orbitWps = generateOrbitWaypoints(polygonCenterWGS84, radius, points, altitude, pitch);
                orbitWps.forEach((wp, idx) => {
                    calculatedWaypointsWGS84.push({ index: idx + 1, ...wp });
                });
            } else {
                let angleDeg = parseFloat(document.getElementById('rotation_angle').value) || 0;
                let offsetX = parseFloat(document.getElementById('offset_x').value) || 0;
                let offsetY = parseFloat(document.getElementById('offset_y').value) || 0;

                let pass1Waypoints = generatePassWaypoints(currentPolygonLatLngs, polygonCenterWGS84, angleDeg, altitude, pitch, offsetX, offsetY);
                let index = 1;
                pass1Waypoints.forEach(wp => {
                    calculatedWaypointsWGS84.push({ index: index++, ...wp });
                });

                if (missionType === '3D') {
                    let pass2Waypoints = generatePassWaypoints(currentPolygonLatLngs, polygonCenterWGS84, angleDeg + 90, altitude, pitch, offsetX, offsetY);
                    pass2Waypoints.forEach(wp => {
                        calculatedWaypointsWGS84.push({ index: index++, ...wp });
                    });
                }
            }

            let totalDistanceMeters = 0;
            for (let i = 0; i < calculatedWaypointsWGS84.length - 1; i++) {
                let wp1 = calculatedWaypointsWGS84[i];
                let wp2 = calculatedWaypointsWGS84[i + 1];
                let dLat = (wp2.latitude - wp1.latitude) * 110574;
                let dLng = (wp2.longitude - wp1.longitude) * 111320 * Math.cos(polygonCenterWGS84.lat * Math.PI / 180);
                totalDistanceMeters += Math.sqrt(dLat * dLat + dLng * dLng);
            }

            let flightTimeSeconds = (totalDistanceMeters / 3.0) + (calculatedWaypointsWGS84.length * 2) + 20;
            let flightTimeMin = Math.floor(flightTimeSeconds / 60);
            let flightTimeSec = Math.round(flightTimeSeconds % 60);

            let distanceFormatted = totalDistanceMeters >= 1000 
                ? `${(totalDistanceMeters / 1000).toFixed(2)} km` 
                : `${Math.round(totalDistanceMeters)} m`;

            flightPathGroup.clearLayers();
            let leafletFlightCoords = calculatedWaypointsWGS84.map(wp => [wp.latitude, wp.longitude]);

            let pathColor = (missionType === '3D') ? '#2563eb' : (missionType === 'ORBIT' ? '#9333ea' : '#ef4444');

            L.polyline(leafletFlightCoords, { color: pathColor, weight: 5, opacity: 0.9 }).addTo(flightPathGroup);
            
            leafletFlightCoords.forEach((coord, i) => {
                L.circleMarker(coord, {
                    radius: 4, fillColor: pathColor, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 1
                }).bindTooltip(`WP ${i+1}`).addTo(flightPathGroup);
            });

            let modeName = missionType === '3D' ? t.mode3d : (missionType === 'ORBIT' ? t.modeOrbit : t.mode2d);
            document.getElementById('output_text').innerHTML = `
                • <b>${t.mission}:</b> ${modeName}<br>
                • <b>${t.length}:</b> ${distanceFormatted}<br>
                • <b>${t.time}:</b> ${flightTimeMin} min ${flightTimeSec} sec<br>
                • <b>${t.photos}:</b> ${calculatedWaypointsWGS84.length} pcs<br>
                • <b>Pitch:</b> ${pitch}°
            `;
        }

        function optimizeAngle() {
            if (currentPolygonLatLngs.length < 3) {
                alert(dict[currentLang].alertDraw);
                return;
            }
            let altitude = parseFloat(document.getElementById('altitude').value) || 40;
            let pitch = parseFloat(document.getElementById('gimbal_pitch').value) || -90;
            let offsetX = parseFloat(document.getElementById('offset_x').value) || 0;
            let offsetY = parseFloat(document.getElementById('offset_y').value) || 0;
            
            let bestAngle = 0;
            let minDistance = Infinity;

            for (let angle = 0; angle < 180; angle += 5) {
                let wps = generatePassWaypoints(currentPolygonLatLngs, polygonCenterWGS84, angle, altitude, pitch, offsetX, offsetY);
                let dist = 0;
                for (let i = 0; i < wps.length - 1; i++) {
                    let dLat = (wps[i+1].latitude - wps[i].latitude) * 110574;
                    let dLng = (wps[i+1].longitude - wps[i].longitude) * 111320 * Math.cos(polygonCenterWGS84.lat * Math.PI / 180);
                    dist += Math.sqrt(dLat * dLat + dLng * dLng);
                }
                if (dist < minDistance) {
                    minDistance = dist;
                    bestAngle = angle;
                }
            }

            document.getElementById('rotation_angle').value = bestAngle;
            document.getElementById('rotation_slider').value = bestAngle;
            calculateFromPolygon();
        }

        function showResultsModal() {
            if (currentPolygonLatLngs.length < 3) {
                alert(dict[currentLang].alertDraw);
                return;
            }
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function downloadFile(content, fileName, contentType) {
            let a = document.createElement("a");
            let file = new Blob([content], {type: contentType});
            a.href = URL.createObjectURL(file);
            a.download = fileName;
            a.click();
        }

        function downloadJSON() {
            let altVal = parseFloat(document.getElementById('altitude').value) || 40;
            let pitch = parseFloat(document.getElementById('gimbal_pitch').value) || -90;
            let missionType = document.getElementById('mission_type').value;

            let mission = {
                missionName: `Potensic_${missionType}_Mission`,
                droneType: "Potensic Atom 2",
                missionType: missionType,
                defaultAltitude: altVal,
                defaultGimbalPitch: pitch,
                totalWaypoints: calculatedWaypointsWGS84.length,
                waypoints: calculatedWaypointsWGS84
            };
            
            downloadFile(JSON.stringify(mission, null, 4), `potensic_mission_${missionType.toLowerCase()}.json`, "application/json");
        }

        function downloadGCP() {
            let gcpText = "EPSG:23700\n";
            currentPolygonLatLngs.forEach((pt, i) => {
                let eovCoord = proj4("EPSG:4326", "EPSG:23700", [pt.lng, pt.lat]);
                gcpText += `${eovCoord[1].toFixed(2)} ${eovCoord[0].toFixed(2)} 100.00 0 0 0 GCP_${i+1}\n`;
            });
            downloadFile(gcpText, "gcp_eov.txt", "text/plain");
        }
    </script>
</body>
