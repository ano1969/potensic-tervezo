<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potensic Atom 2 - Tervező</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #cbd5e1;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1005;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .floating-panel {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            width: calc(100% - 20px);
            max-width: 420px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
        }

        .floating-panel.hidden {
            display: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .panel-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .lang-select {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            background: #f1f5f9;
            cursor: pointer;
            color: #475569;
        }

        .btn-close-panel {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
        }

        .panel-field label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .panel-field input, .panel-field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            background: #f8fafc;
        }

        .angle-control {
            margin-bottom: 10px;
        }

        .angle-header label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
        }

        .angle-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .angle-slider-container input[type="range"] {
            flex-grow: 1;
            height: 6px;
            accent-color: #2563eb;
        }

        .angle-slider-container input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-optimize {
            background: #059669;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.4);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .results-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: #0369a1;
            margin-bottom: 16px;
        }

        .btn-download {
            width: 100%;
            padding: 11px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-drone { background: #0284c7; color: white; }
        .btn-gcp { background: #475569; color: white; }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="toggle-btn" id="togglePanelBtn" onclick="togglePanel()">⚙️ Tervező Panel</button>

    <div class="floating-panel" id="controlPanel">
        <div class="panel-header">
            <div class="panel-title-area">
                <h3 class="panel-title" id="lbl_title">Potensic Tervező</h3>
                <select id="lang_select" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="hu">HU</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <button class="btn-close-panel" onclick="togglePanel()">&times;</button>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="mission_type" id="lbl_mission">Küldetés</label>
                <select id="mission_type" onchange="onMissionTypeChange()">
                    <option value="2D" id="opt_2d">2D Topográfia</option>
                    <option value="3D" id="opt_3d">3D Rácshálós</option>
                    <option value="ORBIT" id="opt_orbit">Épület körbejárás (Orbit)</option>
                </select>
            </div>
            <div class="panel-field">
                <label for="altitude" id="lbl_alt">Magasság (m)</label>
                <input type="number" id="altitude" value="40" step="1" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="gimbal_pitch" id="lbl_pitch">Kamera szög (°)</label>
                <input type="number" id="gimbal_pitch" value="-90" min="-90" max="0" step="5" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field">
                <label for="drone_speed" id="lbl_speed">Sebesség (m/s)</label>
                <input type="number" id="drone_speed" value="3.0" min="1.0" max="10.0" step="0.5" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid" style="grid-template-columns: 1fr;" id="optimize_container">
            <button class="btn-action btn-optimize" id="btn_optimize" onclick="optimizeAngle()">Optimalizálás (Legrövidebb útvonal)</button>
        </div>

        <div class="panel-grid" id="orbit_params" style="display: none;">
            <div class="panel-field">
                <label for="orbit_radius" id="lbl_radius">Sugár (m)</label>
                <input type="number" id="orbit_radius" value="25" min="5" max="200" step="1"
