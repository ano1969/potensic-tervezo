<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potensic Atom 2 - EOV Térképes Tervező</title>
    <!-- Leaflet & Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Áttetsző lebegő panel a térkép tetején */
        .floating-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            width: calc(100% - 24px);
            max-width: 440px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
        }

        .panel-field label {
            font-size: 11px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-field input, .panel-field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            background: #f8fafc;
        }

        .angle-control {
            margin-bottom: 10px;
        }

        .angle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .angle-header label {
            font-size: 11px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
        }

        .angle-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .angle-slider-container input[type="range"] {
            flex-grow: 1;
            height: 6px;
            accent-color: #2563eb;
        }

        .angle-slider-container input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-optimize {
            background: #059669;
        }

        /* Felugró Modal ablak */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .results-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #0369a1;
            margin-bottom: 16px;
        }

        .btn-download {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-drone { background: #0284c7; color: white; }
        .btn-gcp { background: #475569; color: white; }
    </style>
</head>
<body>

    <!-- Műholdas térkép -->
    <div id="map"></div>

    <!-- Áttetsző lebegő felület -->
    <div class="floating-panel">
        <div class="panel-grid">
            <div class="panel-field">
                <label for="mission_type">Küldetés típusa</label>
                <select id="mission_type" onchange="onMissionTypeChange()">
                    <option value="2D">2D Topográfia (Egyutas)</option>
                    <option value="3D">3D Modell (Rácshálós)</option>
                </select>
            </div>
            <div class="panel-field">
                <label for="altitude">Magasság (m)</label>
                <input type="number" id="altitude" value="40" step="1" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="gimbal_pitch">Kamera szög (°)</label>
                <input type="number" id="gimbal_pitch" value="-90" min="-90" max="0" step="5" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field" style="justify-content: flex-end;">
                <button class="btn-action btn-optimize" onclick="optimizeAngle()">Optimalizálás</button>
            </div>
        </div>

        <!-- Elforgatás csúszka -->
        <div class="angle-control">
            <div class="angle-header">
                <label for="rotation_angle">Útvonal Elforgatás (°)</label>
            </div>
            <div class="angle-slider-container">
                <input type="range" id="rotation_slider" min="0" max="355" step="5" value="0" oninput="updateRotationFromSlider(this.value)">
                <input type="number" id="rotation_angle" min="0" max="355" step="5" value="0" onchange="updateRotationFromInput(this.value)">
            </div>
        </div>

        <button class="btn-action" style="width: 100%;" onclick="showResultsModal()">Részletek & Letöltés</button>
    </div>

    <!-- Eredmények POPUP (Modal) Ablak -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Repülési & Fotó Adatok</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="results-box" id="output_text"></div>
            
            <button class="btn-download btn-drone" onclick="downloadJSON()">
                Drón JSON (WGS84) Letöltése
            </button>
            <button class="btn-download btn-gcp" onclick="downloadGCP()">
                WebODM GCP (EPSG:23700) Letöltése
            </button>
        </div>
    </div>

    <!-- Leaflet, Draw & Proj4 JS könyvtárak -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <script>
        proj4.defs("EPSG:23700", "+proj=somerc +lat_0=47.14439372222222 +lon_0=19.04857177777778 +k_0=0.99993 +x_0=650000 +y_0=200000 +ellps=GRS67 +units=m +no_defs");

        var map = L.map('map', { zoomControl: false }).setView([48.25, 20.62], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        var flightPathGroup = new L.FeatureGroup();
        map.addLayer(drawnItems);
        map.addLayer(flightPathGroup);

        var drawControl = new L.Control.Draw({
            position: 'topleft',
            edit: { featureGroup: drawnItems },
            draw: {
                polygon: true,
                rectangle: true,
                polyline: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        let currentPolygonEOV = [];
        let calculatedWaypointsEOV = [];
        let calculatedGCPs = [];
        let polygonCenterEOV = { X: 0, Y: 0 };

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.clearLayers();
            flightPathGroup.clearLayers();
            var layer = e.layer;
            drawnItems.addLayer(layer);

            let latlngs = layer.getLatLngs()[0];
            currentPolygonEOV = latlngs.map(pt => {
                let eovCoord = proj4("EPSG:4326", "EPSG:23700", [pt.lng, pt.lat]);
                return { X: eovCoord[1], Y: eovCoord[0] };
            });

            // Középpont kiszámítása
            let sumX = 0, sumY = 0;
            currentPolygonEOV.forEach(p => { sumX += p.X; sumY += p.Y; });
            polygonCenterEOV = { X: sumX / currentPolygonEOV.length, Y: sumY / currentPolygonEOV.length };

            calculateFromPolygon();
        });

        function onMissionTypeChange() {
            let mType = document.getElementById('mission
