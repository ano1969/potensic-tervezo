<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potensic Atom 2 - Tervező</title>
    <!-- Leaflet & Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1005;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .floating-panel {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            width: calc(100% - 20px);
            max-width: 420px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
            transition: opacity 0.2s ease;
        }

        .floating-panel.hidden {
            display: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .panel-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .lang-select {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            background: #f1f5f9;
            cursor: pointer;
            color: #475569;
        }

        .btn-close-panel {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
        }

        .panel-field label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .panel-field input, .panel-field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            background: #f8fafc;
        }

        .angle-control {
            margin-bottom: 10px;
        }

        .angle-header label {
            font-size: 10px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
        }

        .angle-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .angle-slider-container input[type="range"] {
            flex-grow: 1;
            height: 6px;
            accent-color: #2563eb;
        }

        .angle-slider-container input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-optimize {
            background: #059669;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.4);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .results-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: #0369a1;
            margin-bottom: 16px;
        }

        .btn-download {
            width: 100%;
            padding: 11px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-drone { background: #0284c7; color: white; }
        .btn-gcp { background: #475569; color: white; }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="toggle-btn" id="togglePanelBtn" onclick="togglePanel()">⚙️ Tervező Panel</button>

    <div class="floating-panel" id="controlPanel">
        <div class="panel-header">
            <div class="panel-title-area">
                <h3 class="panel-title" id="lbl_title">Potensic Tervező</h3>
                <select id="lang_select" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="hu">HU</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <button class="btn-close-panel" onclick="togglePanel()">&times;</button>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="mission_type" id="lbl_mission">Küldetés</label>
                <select id="mission_type" onchange="onMissionTypeChange()">
                    <option value="2D" id="opt_2d">2D Topográfia</option>
                    <option value="3D" id="opt_3d">3D Rácshálós</option>
                    <option value="ORBIT" id="opt_orbit">Épület körbejárás (Orbit)</option>
                </select>
            </div>
            <div class="panel-field">
                <label for="altitude" id="lbl_alt">Magasság (m)</label>
                <input type="number" id="altitude" value="40" step="1" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid">
            <div class="panel-field">
                <label for="gimbal_pitch" id="lbl_pitch">Kamera szög (°)</label>
                <input type="number" id="gimbal_pitch" value="-90" min="-90" max="0" step="5" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field">
                <label for="drone_speed" id="lbl_speed">Sebesség (m/s)</label>
                <input type="number" id="drone_speed" value="3.0" min="1.0" max="10.0" step="0.5" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="panel-grid" style="grid-template-columns: 1fr;" id="optimize_container">
            <button class="btn-action btn-optimize" id="btn_optimize" onclick="optimizeAngle()">Optimalizálás (Legrövidebb útvonal)</button>
        </div>

        <div class="panel-grid" id="orbit_params" style="display: none;">
            <div class="panel-field">
                <label for="orbit_radius" id="lbl_radius">Sugár (m)</label>
                <input type="number" id="orbit_radius" value="25" min="5" max="200" step="1" onchange="recalculateIfPolygonExists()">
            </div>
            <div class="panel-field">
                <label for="orbit_points" id="lbl_points">Fotópontok</label>
                <input type="number" id="orbit_points" value="16" min="6" max="36" step="2" onchange="recalculateIfPolygonExists()">
            </div>
        </div>

        <div class="angle-control" id="rotation_container">
            <div class="angle-header">
                <label for="rotation_angle" id="lbl_rot">Útvonal Elforgatás (°)</label>
            </div>
            <div class="angle-slider-container">
                <input type="range" id="rotation_slider" min="0" max="355" step="5" value="0" oninput="updateRotationFromSlider(this.value)">
                <input type="number" id="rotation_angle" min="0" max="355" step="5" value="0" onchange="updateRotationFromInput(this.value)">
            </div>
        </div>

        <button class="btn-action" style="margin-top: 4px;" id="btn_details" onclick="showResultsModal()">Részletek & Letöltés</button>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="lbl_modal_title">Repülési Adatok</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="results-box" id="output_text"></div>
            <button class="btn-download btn-drone" id="btn_dl_drone" onclick="downloadJSON()">Drón JSON (WGS84) Letöltése</button>
            <button class="btn-download btn-gcp" id="btn_dl_gcp" onclick="downloadGCP()">WebODM GCP (EPSG:23700) Letöltése</button>
        </div>
    </div>

    <!-- Leaflet, Draw & Proj4 JS könyvtárak -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <script>
        const dict = {
            hu: {
                toggleBtn: "⚙️ Tervező Panel",
                title: "Potensic Tervező",
                mission: "Küldetés",
                opt2d: "2D Topográfia",
                opt3d: "3D Rácshálós",
                optOrbit: "Épület körbejárás (Orbit)",
                alt: "Magasság (m)",
                pitch: "Kamera szög (°)",
                speed: "Sebesség (m/s)",
                optimize: "Optimalizálás (Legrövidebb útvonal)",
                radius: "Sugár (m)",
                points: "Fotópontok",
                rot: "Útvonal Elforgatás (°)",
                details: "Részletek & Letöltés",
                modalTitle: "Repülési Adatok",
                dlDrone: "Drón JSON (WGS84) Letöltése",
                dlGcp: "WebODM GCP (EPSG:23700) Letöltése",
                alertDraw: "Előbb rajzolj ki egy területet a térképen!",
                mode2d: "2D Topográfia",
                mode3d: "3D Rácshálós",
                modeOrbit: "Épület körbejárás (Orbit)",
                length: "Útvonal hossza",
                time: "Repülési idő",
                photos: "Fotópontok száma"
            },
            en: {
                toggleBtn: "⚙️ Planner Panel",
                title: "Potensic Planner",
                mission: "Mission",
                opt2d: "2D Topography",
                opt3d: "3D Cross-Grid",
                optOrbit: "Building Orbit",
                alt: "Altitude (m)",
                pitch: "Gimbal Pitch (°)",
                speed: "Speed (m/s)",
                optimize: "Optimize (Shortest Route)",
                radius: "Radius (m)",
                points: "Photo Points",
                rot: "Route Rotation (°)",
                details: "Details & Download",
                modalTitle: "Flight Data",
                dlDrone: "Download Drone JSON (WGS84)",
                dlGcp: "Download WebODM GCP (EPSG:23700)",
                alertDraw: "Please draw an area on the map first!",
                mode2d: "2D Topography",
                mode3d: "3D Cross-Grid",
                modeOrbit: "Building Orbit",
                length: "Route Length",
                time: "Flight Time",
                photos: "Photo Points"
            }
        };

        let currentLang = 'hu';

        function changeLanguage(lang) {
            currentLang = lang;
            let t = dict[lang];
            document.getElementById('togglePanelBtn').innerText = t.toggleBtn;
            document.getElementById('lbl_title').innerText = t.title;
            document.getElementById('lbl_mission').innerText = t.mission;
            document.getElementById('opt_2d').innerText = t.opt2d;
            document.getElementById('opt_3d').innerText = t.opt3d;
            document.getElementById('opt_orbit').innerText = t.optOrbit;
            document.getElementById('lbl_alt').innerText = t.alt;
            document.getElementById('lbl_pitch').innerText = t.pitch;
            document.getElementById('lbl_speed').innerText = t.speed;
            document.getElementById('btn_optimize').innerText = t.optimize;
            document.getElementById('lbl_radius').innerText = t.radius;
            document.getElementById('lbl_points').innerText = t.points;
            document.getElementById('lbl_rot').innerText = t.rot;
            document.getElementById('btn_details').innerText = t.details;
            document.getElementById('lbl_modal_title').innerText = t.modalTitle;
            document.getElementById('btn_dl_drone').innerText = t.dlDrone;
            document.getElementById('btn_dl_gcp').innerText = t.dlGcp;

            recalculateIfPolygonExists();
        }

        proj4.defs("EPSG:23700", "+proj=somerc +lat_0=47.14439372222222 +lon_0=19.04857177777778 +k_0=0.99993 +x_0=650000 +y_0=200000 +ellps=GRS67 +units=m +no_defs");

        var map = L.map('map', { zoomControl: false }).setView([48.25, 20.62], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        var tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        setTimeout(function() { map.invalidateSize(); }, 200);

        var drawnItems = new L.FeatureGroup();
        var flightPathGroup = new L.FeatureGroup().addTo(map);
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topleft',
            edit: { featureGroup: drawnItems },
            draw: {
                polygon: true,
                rectangle: true,
                polyline: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        let currentPolygonLatLngs = [];
        let calculatedWaypointsWGS84 = [];
        let originalCenterWGS84 = { lat: 0, lng: 0 };
        let activeCenterWGS84 = { lat: 0, lng: 0 };
        let centerMarker = null;

        L.DomEvent.disableClickPropagation(document.getElementById('controlPanel'));
        L.DomEvent.disableClickPropagation(document.getElementById('togglePanelBtn'));

        function togglePanel() {
            let panel = document.getElementById('controlPanel');
            panel.classList.toggle('hidden');
        }

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.clearLayers();
            flightPathGroup.clearLayers();
            if (centerMarker) map.removeLayer(centerMarker);

            var layer = e.layer;
            drawnItems.addLayer(layer);

            currentPolygonLatLngs = layer.getLatLngs()[0];

            let sumLat = 0, sumLng = 0;
            currentPolygonLatLngs.forEach(p => { sumLat += p.lat; sumLng += p.lng; });
            originalCenterWGS84 = { lat: sumLat / currentPolygonLatLngs.length, lng: sumLng / currentPolygonLatLngs.length };
            activeCenterWGS84 = { lat: originalCenterWGS84.lat, lng: originalCenterWGS84.lng };

            // Húzható középponti marker létrehozása
            centerMarker = L.marker([activeCenterWGS84.lat, activeCenterWGS84.lng], {
                draggable: true,
                icon: L.divIcon({
                    className: 'custom-drag-icon',
                    html: '<div style="background: #f97316; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 0 8px rgba(0,0,0,0.5); cursor: move;"></div>',
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                })
            }).addTo(map);

            centerMarker.on('drag', function(evt) {
                let newPos = evt.target.getLatLng();
                activeCenterWGS84 = { lat: newPos.lat, lng: newPos.lng };
                calculateFromPolygon();
            });

            calculateFromPolygon();
        });

        function onMissionTypeChange() {
            let mType = document.getElementById('mission_type').value;
            let pitchInput = document.getElementById('gimbal_pitch');
            let orbitParams = document.getElementById('orbit_params');
            let rotContainer = document.getElementById('rotation_container');
            let optContainer = document.getElementById('optimize_container');

            if (mType === 'ORBIT') {
                orbitParams.style.display = 'grid';
                rotContainer.style.display = 'none';
                optContainer.style.display = 'none';
                if (pitchInput.value === '-90' || pitchInput.value === '-60') {
                    pitchInput.value = '-45';
                }
            } else {
                orbitParams.style.display = 'none';
                rotContainer.style.display = 'block';
                optContainer.style.display = 'grid';
                if (mType === '3D') pitchInput.value = '-60';
                if (mType === '2D') pitchInput.value = '-90';
            }
            recalculateIfPolygonExists();
        }

        function updateRotationFromSlider(val) {
            document.getElementById('rotation_angle').value = val;
            calculateFromPolygon();
        }

        function updateRotationFromInput(val) {
            document.getElementById('rotation_slider').value = val;
            calculateFromPolygon();
        }

        function recalculateIfPolygonExists() {
            if (currentPolygonLatLngs.length >= 3) {
                calculateFromPolygon();
            }
        }

        function rotateWGS84Point(pt, center, angleRad) {
            let cos = Math.cos(angleRad);
            let sin = Math.sin(angleRad);
            let dLng = (pt.lng - center.lng) * 111320 * Math.cos(center.lat * Math.PI / 180);
            let dLat = (pt.lat - center.lat) * 110574;
            let rotDLng = dLng * cos - dLat * sin;
            let rotDLat = dLng * sin + dLat * cos;
            return {
                lat: center.lat + (rotDLat / 110574),
                lng: center.lng + (rotDLng / (111320 * Math.cos(center.lat * Math.PI / 180)))
            };
        }

        function generateOrbitWaypoints(center, radiusM, pointsCount, altitude, pitch, speed) {
            let waypoints = [];
            for (let i = 0; i < pointsCount; i++) {
                let angle = (i / pointsCount) * 2 * Math.PI;
                let dLng = (radiusM * Math.cos(angle)) / (111320 * Math.cos(center.lat * Math.PI / 180));
                let dLat = (radiusM * Math.sin(angle)) / 110574;

                waypoints.push({
                    latitude: Number((center.lat + dLat).toFixed(7)),
                    longitude: Number((center.lng + dLng).toFixed(7)),
                    altitude: altitude,
                    gimbalPitch: pitch,
                    speedMs: speed,
                    action: "TAKE_PHOTO"
                });
            }
            if (waypoints.length > 0) {
                waypoints.push({...waypoints[0]});
            }
            return waypoints;
        }

        function generatePassWaypoints(polygonLatLngs, center, angleDeg, altitude, pitch, speed) {
            let angleRad = angleDeg * (Math.PI / 180);
            let rotatedPoly = polygonLatLngs.map(pt => rotateWGS84Point(pt, center, -angleRad));

            let fovRad = 79.4 * (Math.PI / 180);
            let groundWidth = 2 * altitude * Math.tan(fovRad / 2);
            let groundHeight = groundWidth * (3.0 / 4.0);

            let rowSpacing = groundWidth * (1.0 - 0.70);
            let photoDistance = groundHeight * (1.0 - 0.80);

            let lats = rotatedPoly.map(p => (p.lat - center.lat) * 110574);
            let lngs = rotatedPoly.map(p => (p.lng - center.lng) * 111320 * Math.cos(center.lat * Math.PI / 180));

            let minX = Math.min(...lats), maxX = Math.max(...lats);
            let minY = Math.min(...lngs), maxY = Math.max(...lngs);

            let heightM = maxX - minX;
            let rows = Math.max(1, Math.floor(heightM / rowSpacing));

            let waypointsRotated = [];
            for (let r = 0; r <= rows; r++) {
                let currX = minX + (r * rowSpacing);
                let yStart = (r % 2 === 0) ? minY : maxY;
                let yEnd = (r % 2 === 0) ? maxY : minY;

                let lineLength = Math.abs(yEnd - yStart);
                let steps = Math.max(1, Math.round(lineLength / photoDistance));

                for (let s = 0; s <= steps;
